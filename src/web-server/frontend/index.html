<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!-- The page holds a live bearer token; keep it out of referrers entirely. -->
    <meta name="referrer" content="no-referrer" />
    <title>afk web</title>
    <!-- Inline data-URI favicon: browsers request /favicon.ico unconditionally,
         and a 404 there logs a console error on every load. Inlining answers it
         without a round trip or an extra asset in the bundle. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%23f9854b'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">afk</span>
      </div>
      <div id="meter" class="meter"></div>
      <div id="status" class="status">idle</div>
      <button id="menu-toggle" class="menu-toggle" aria-label="Toggle sessions">☰</button>
    </header>

    <main class="layout">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-head">Sessions</div>
        <div id="sessions" class="sessions"></div>
      </aside>

      <section class="main">
        <div id="transcript" class="transcript"></div>
        <div id="composer" class="composer">
          <div id="queue" class="queue"></div>
          <div class="composer-row">
            <textarea id="prompt" rows="2" placeholder="Message the agent…"></textarea>
            <button id="send" class="send">Send</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
    <script type="module">
      // Small-screen sidebar toggle. Inline because it is pure chrome and has
      // no dependency on the bundle's state.
      const btn = document.getElementById('menu-toggle');
      btn?.addEventListener('click', () => {
        document.getElementById('sidebar')?.classList.toggle('is-open');
      });
    </script>
  </body>
</html>
