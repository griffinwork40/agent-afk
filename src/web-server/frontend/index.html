<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!-- The page holds a live bearer token; keep it out of referrers entirely. -->
    <meta name="referrer" content="no-referrer" />
    <!-- Server-templated on the document response only. The bearer token is
         delivered HERE rather than in a JS-readable cookie: cookies are scoped
         by host and not by port, so any page on another 127.0.0.1:<port> origin
         could read a non-HttpOnly cookie and drive the agent. A <meta> tag (not
         an inline <script>) because the CSP sets script-src 'self'. -->
    <meta name="afk-token" content="__AFK_WEB_TOKEN__" />
    <title>afk web</title>
    <!-- Inline data-URI favicon: browsers request /favicon.ico unconditionally,
         and a 404 there logs a console error on every load. Inlining answers it
         without a round trip or an extra asset in the bundle. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%23f9854b'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/approvals.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">afk</span>
      </div>
      <div id="meter" class="meter"></div>
      <div id="status" class="status">idle</div>
      <button id="menu-toggle" class="menu-toggle" aria-label="Toggle sessions">☰</button>
    </header>

    <main class="layout">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-head">
          <span>Sessions</span>
          <button id="new-session" class="new-session" title="Start a new session">+ New</button>
        </div>
        <div id="sessions" class="sessions"></div>
      </aside>

      <section class="main">
        <div id="transcript" class="transcript"></div>
        <div id="approvals" class="approvals"></div>
        <div id="composer" class="composer">
          <div id="slash-menu" class="slash-menu" hidden></div>
          <div id="queue" class="queue"></div>
          <div class="composer-row">
            <!-- The mirror renders the highlighted copy of the textarea's text;
                 the textarea paints its own text transparent and keeps the
                 caret. Both must share text metrics — see styles.css. -->
            <div class="prompt-wrap">
              <div id="prompt-mirror" class="prompt-mirror" aria-hidden="true"></div>
              <textarea id="prompt" rows="2" placeholder="Message the agent…"></textarea>
            </div>
            <button id="stop" class="stop" hidden>Stop</button>
            <button id="send" class="send">Send</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
    <!-- Was an inline <script>; moved to a file because the document is served
         under `script-src 'self'`, which blocks inline execution. -->
    <script type="module" src="/chrome.js"></script>
  </body>
</html>
