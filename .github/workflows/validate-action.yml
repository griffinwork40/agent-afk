name: Validate run-afk action

# Runs whenever the composite action definition or its tests change.
on:
  pull_request:
    paths:
      - '.github/actions/run-afk/**'
      - 'tests/github-action.test.ts'
      - '.github/workflows/validate-action.yml'
  push:
    branches: [main]
    paths:
      - '.github/actions/run-afk/**'
      - 'tests/github-action.test.ts'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Mirror ci.yml policy: never cancel in-progress runs on the default branch
  # (issue #3770). PRs still cancel eagerly.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-action-yaml:
    name: Lint action.yml (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # pinned to SHA for supply-chain safety; tag: actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        # pinned to SHA for supply-chain safety; tag: pnpm/action-setup@v6.0.10
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          # No `version:` here: this workflow runs inside this repo, whose
          # package.json#packageManager already pins pnpm exactly. Setting both
          # makes pnpm/action-setup v6 fail with "Multiple versions of pnpm
          # specified" (same convention as ci.yml). The run-afk action itself
          # pins `version: 11` with package_json_file=/dev/null because it runs
          # in consumer repos.
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        # pinned to SHA for supply-chain safety; tag: actions/setup-node@v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run action.yml unit tests
        run: pnpm test tests/github-action.test.ts
