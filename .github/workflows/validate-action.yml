name: Validate run-afk action

# Runs whenever the composite action definition or its tests change.
on:
  pull_request:
    paths:
      - '.github/actions/run-afk/**'
      - 'tests/github-action.test.ts'
      - '.github/workflows/validate-action.yml'
  push:
    branches: [main]
    paths:
      - '.github/actions/run-afk/**'
      - 'tests/github-action.test.ts'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-action-yaml:
    name: Lint action.yml (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # pinned to SHA for supply-chain safety; tag: actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        # pinned to SHA for supply-chain safety; tag: pnpm/action-setup@v6
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        # pinned to SHA for supply-chain safety; tag: actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run action.yml unit tests
        run: pnpm test tests/github-action.test.ts
