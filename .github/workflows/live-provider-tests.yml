name: Live Provider Tests

# Nightly smoke test against real provider APIs.
# NOT part of the regular PR gate — failures open/update a tracking issue
# instead of blocking merges. See docs/development.md for manual run info.
#
# Cost note: each run is ~$0.0001 (gpt-4o-mini, two calls) + negligible
# Anthropic usage (claude-sonnet-5, one call, maxOutputTokens=20). Nightly
# cadence keeps monthly spend well under $0.01.
#
# Repository secrets (Settings → Secrets → Actions):
#   CLAUDE_CODE_OAUTH_TOKEN   – Anthropic Claude OAuth token
#   OPENAI_API_KEY            – OpenAI API key (sk-...)
#
# Both must be set for the tests to run. If either is missing, the `gate` job
# reports which one and the `live-tests` job is skipped, so the run does not
# fail and does not claim to have tested anything.

on:
  schedule:
    # 02:00 UTC every day (low-traffic window, minimises API latency).
    - cron: '0 2 * * *'
  workflow_dispatch:

# No concurrent live runs — prevent duplicate billed calls if re-triggered
# manually while the nightly is still running.
concurrency:
  group: live-provider-tests
  cancel-in-progress: true

# Opt JS-based actions into Node.js 24 ahead of the June 2026 default flip.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  # Needed to open / comment on the tracking issue on failure.
  issues: write
  # Default read-only for everything else.
  contents: read

jobs:
  # Without credentials the Anthropic test throws on its first line, which
  # made this workflow fail every night while testing nothing. The gate turns
  # that into an explicit skip. Secret values are only tested for emptiness
  # and are never printed.
  gate:
    name: Check provider secrets
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
    steps:
      - name: Check that both provider secrets are set
        id: check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          MISSING=""
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || MISSING="$MISSING CLAUDE_CODE_OAUTH_TOKEN"
          [ -n "$OPENAI_API_KEY" ] || MISSING="$MISSING OPENAI_API_KEY"

          if [ -z "$MISSING" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=Live provider tests skipped::Missing repository secrets:$MISSING. Nothing was tested."
          {
            echo "### Live provider tests skipped"
            echo ""
            echo "Missing repository secrets:$MISSING"
            echo ""
            echo "No provider API was called. Add the secrets under Settings → Secrets → Actions to turn the nightly tests on."
          } >> "$GITHUB_STEP_SUMMARY"

  live-tests:
    name: Live provider smoke tests
    needs: gate
    if: needs.gate.outputs.has_secrets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        # No `version:` here: package.json#packageManager pins pnpm exactly.
        # Setting both makes pnpm/action-setup v6 fail with "Multiple versions
        # of pnpm specified" (same convention as ci.yml / validate-action.yml).
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run live provider tests
        env:
          RUN_LIVE_API: '1'
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pnpm exec vitest run \
            src/agent/providers/anthropic-direct.live.test.ts \
            src/agent/providers/openai-compatible/openai-compatible.live.test.ts

      # On failure, open a new issue or add a comment to the existing open
      # tracking issue (labelled "live-test-failure") rather than failing
      # the PR gate.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABEL="live-test-failure"
          TITLE="ci: live provider tests failing (nightly)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # The label has to exist before `gh issue create --label` can use
          # it. --force makes this a no-op when it is already there.
          gh label create "$LABEL" \
            --description "Nightly live provider tests are failing" \
            --color B60205 \
            --force

          # Find an existing open issue with the label.
          EXISTING=$(gh issue list \
            --label "$LABEL" \
            --state open \
            --json number \
            --jq '.[0].number // empty' \
            2>/dev/null)

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" \
              --body "Live provider tests failed again: $RUN_URL"
          else
            printf 'Live provider tests are failing. See: %s\n\nThis issue is auto-managed by the `live-provider-tests` workflow.\nIt is opened on the first failure and updated with comments on subsequent failures.\nClose it once the tests are green again.' \
              "$RUN_URL" > /tmp/issue-body.md
            gh issue create \
              --title "$TITLE" \
              --label "$LABEL" \
              --body-file /tmp/issue-body.md
          fi
