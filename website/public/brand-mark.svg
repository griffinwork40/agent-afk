<?xml version="1.0" encoding="UTF-8"?>
<!--
  Agent AFK — navbar brand glyph ("Handoff Arc"), transparent variant, v2.

  Matches the v2 favicon's boosted palette: brighter arc gradient and
  hotter ping so the mark still reads at 32×32 in the docs navbar.
  Endpoint nodes included (appropriate at ≥32px).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Agent AFK">
  <defs>
    <linearGradient id="arc" x1="11" y1="42" x2="53" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a0a0b8"/>
      <stop offset="40%" stop-color="#6dd5a0"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <radialGradient id="ping" cx="45%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ffd4b8"/>
      <stop offset="40%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>
  </defs>

  <!-- Arc: endpoints (11,42) -> (53,42), r=23, large-arc, clockwise (90° gap at bottom) -->
  <path d="M 11 42 A 23 23 0 1 1 53 42"
        fill="none"
        stroke="url(#arc)"
        stroke-width="8"
        stroke-linecap="round"/>

  <!-- Endpoint nodes -->
  <circle cx="11" cy="42" r="4.5" fill="#a0a0b8"/>
  <circle cx="53" cy="42" r="4.5" fill="#4ade80"/>

  <!-- Ping in the gap -->
  <circle cx="32" cy="52" r="6" fill="url(#ping)"/>
</svg>
